  <rect width="256" height="256" fill="#0A0E14"/>
  <rect x="16" y="16" width="224" height="224" rx="8" fill="#2A3340"/>
  <path d="M24 16H232L224 24H32L24 32V224L16 232V24Z" fill="#3E4A5A" opacity="0.72"/>
