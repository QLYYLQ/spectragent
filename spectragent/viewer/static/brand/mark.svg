      <g fill="currentColor"><rect x="40" y="120" width="72" height="8"/><rect x="128" y="88" width="24" height="8"/><rect x="152" y="80" width="24" height="8"/><rect x="176" y="72" width="24" height="8"/><rect x="200" y="64" width="16" height="8"/><rect x="136" y="104" width="24" height="8"/><rect x="160" y="96" width="24" height="8"/><rect x="184" y="88" width="32" height="8"/><rect x="144" y="120" width="24" height="8"/><rect x="168" y="112" width="48" height="8"/><rect x="144" y="136" width="72" height="8"/><rect x="144" y="152" width="24" height="8"/><rect x="168" y="160" width="48" height="8"/><rect x="152" y="168" width="24" height="8"/><rect x="176" y="176" width="24" height="8"/><rect x="200" y="184" width="16" height="8"/></g>
