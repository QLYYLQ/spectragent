    </pattern>
    <filter id="sg-mark-dark-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <g id="sg-mark-dark-spectrum" shape-rendering="crispEdges">
