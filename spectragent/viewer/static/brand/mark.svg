<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="sg-mark-dark-title sg-mark-dark-desc">
  <title id="sg-mark-dark-title">Spectragent prism mark, dark</title>
  <desc id="sg-mark-dark-desc">A dark optical instrument faceplate with one input beam and six discrete spectral channels.</desc>
  <defs>
