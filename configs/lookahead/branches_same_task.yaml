# The same-task forks' task source (branch_same_task.yaml): every fourth policy
# step, offset 1, of the reviewed recordings; two decisions per checkpoint.
# Select it with --benchmark (lookahead/README.md, A collection round):
#
#   spectragent bench --config "$ROUND_DIR/configs/branch_same_task.yaml" \
#     --benchmark "$ROUND_DIR/configs/branches_same_task.yaml"
#
# Each fork belongs to its source run's benchmark (docs/architecture_design.md
# §4.10.1 "分叉 sweep 是一种任务来源"). Copy this file to a round directory and
# replace tmp/lookahead/round before execution.
benchmark:
- benchmark_id: trace_branches
  task_loader:
    benchmark_name: trace_branches
    data_dir: tmp/lookahead/round/record
    exclude_runs: tmp/lookahead/round/out/health/reviewed-exclusions.json
    branches_per_step: 2
    agent_outcome: any
    on_unbranchable: skip
    exclude_unloaded_checkpoints: true
    step_selector:
      selector_id: every_k
      k: 4
      offset: 1
