# Baidu: rnd is the hm.gif pixel random number; stamp is the rt.jpg tracking timestamp.
# Event fields on hm.gif (ep, et, tt, vl) remain distinct; unrecorded events get a synthetic 204.
rules:
- id: baidu-analytics-pixel
  scope:
    host: hm.baidu.com
    path: /hm.gif
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - rnd
  keep_query:
  - ep
  - et
  - tt
  - vl
  synthesize_204:
  - https://hm.baidu.com/hm.gif*
- id: baidu-ad-tracking-pixel
  scope:
    host: eclick.baidu.com
    path: /rt.jpg
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - stamp
