# Only the recorded risk script d.min.js has evidence for treating v as a cache buster
# (1791879616082 vs 202610141414). Other versioned scripts keep v.
# The bee collector is a POST log; bf.gif is its image fallback with the event in d.
rules:
- id: ctrip-risk-script
  scope:
    host: webresource.c-ctrip.com
    path: /ares2/risk/ubtrms/*/default/dist/d.min.js
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - v
- id: ctrip-telemetry-collector
  scope:
    host: s.c-ctrip.com
    path: /bee/collect
    method: POST
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  synthesize_204:
  - https://s.c-ctrip.com/bee/collect*
- id: ctrip-telemetry-pixel
  scope:
    host: s.c-ctrip.com
    path: /bf.gif
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  synthesize_204:
  - https://s.c-ctrip.com/bf.gif*
