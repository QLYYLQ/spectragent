# LeTV video (www.le.com, so.le.com, apple.www.le.com, dc-so.le.com).
# lc, uuid, device_id: the visitor's device id and visit ids, generated in the page
#   (lc fb86738b... vs ed025601...); the replay's ids are the recording's random draws
#   shifted. They select nothing.
# jsonp: sso.le.com's login calls (User/getPlatInfo?plat=www, user/setCountryLang?lang=...
#   and ?country=...) name their JSONP callback vjs_<time><two random digits>
#   (vjs_179195905609142 vs vjs_179195905609196), and the answer calls that name
#   (vjs_179195905609196({...})); the replay writes the name the request asks for in its
#   place (docs/architecture_design.md §4.14 "JSONP 回调名"), so ignoring it is safe. The
#   path and plat / lang / country pick the call. Only sso.le.com carries a jsonp parameter.
ignore_query: [lc, uuid, device_id, jsonp]
# Not ignored: cur_url, the page a pixel reports on.
