# Recorded LeTV statistics pixels carry generated visit/device ids (fb86738b... vs ed025601...).
# Only those pixels ignore them. The two sso endpoints use vjs_<time><random> JSONP names;
# replay rewrites the opening callback. plat/lang/country and cur_url stay.
rules:
- id: letv-operation-pixel
  scope:
    host: apple.www.le.com
    path: /op/
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - lc
  - uuid
  keep_query:
  - cur_url
- id: letv-search-statistics
  scope:
    host: dc-so.le.com
    path: /data_collect.so
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - device_id
  keep_query:
  - cur_url
- id: letv-platform-callback
  scope:
    host: sso.le.com
    path: /User/getPlatInfo
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - jsonp
  keep_query:
  - plat
- id: letv-language-callback
  scope:
    host: sso.le.com
    path: /user/setCountryLang
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - jsonp
  keep_query:
  - lang
  - country
