# On the search ajaxpipe endpoint t is a timestamp and reqID is the request counter
# (1 vs 0); recorded responses do not echo reqID. Content selectors stay.
# The old domain-wide rule also reached the home page; that scope is not retained.
rules:
- id: acfun-search-ajaxpipe
  scope:
    host: www.acfun.cn
    path: /search
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - t
  - reqID
  keep_query:
  - keyword
  - sortType
  - type
  - pagelets
- id: acfun-performance-log
  scope:
    host: apilog-web.acfun.cn
    path: /rest/direct/frontend/perfLog
    method: POST
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  synthesize_204:
  - https://apilog-web.acfun.cn/rest/direct/frontend/perfLog*
