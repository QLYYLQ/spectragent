# dc/fe-go pixel fields are visit/run ids; _r is a random float (0.1749... vs 0.8379...).
# vvid on /s is a random UUID plus timestamp; ark and n select the ad.
# Search endpoints retain lc/device_id and ps: the statistics evidence does not authorize them.
rules:
- id: letv-environment-pixel
  scope:
    host: dc.letv.com
    path: /env/
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - apprunid
  - lc
  - uuid
  keep_query:
  - ap
  - url
- id: letv-operation-log
  scope:
    host: dc.letv.com
    path: /op/
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - apprunid
  - lc
  - uuid
  keep_query:
  - ap
  - url
- id: letv-page-view
  scope:
    host: dc.letv.com
    path: /pgv/
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - apprunid
  - lc
  - uuid
  - weid
  keep_query:
  - ap
  - url
- id: letv-query-pixel
  scope:
    host: dc.letv.com
    path: /qy/
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - lc
  - uuid
  keep_query:
  - ap
  - url
- id: letv-frontend-pixel
  scope:
    host: fe-go.letv.com
    path: /ds
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - _r
  - lc
  keep_query:
  - ap
  - url
- id: letv-ad-view
  scope:
    host: ark.letv.com
    path: /s
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - vvid
  keep_query:
  - ark
  - n
