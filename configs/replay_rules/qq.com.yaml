# Tencent telemetry inside the Qidian sharing frame. The recorded beacon/profile
# reports are POST; the earlier h.trace host-only rule has no endpoint evidence and is removed.
rules:
- id: tencent-beacon-upload
  scope:
    host: otheve.beacon.qq.com
    path: /analytics/v2_upload
    method: POST
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  synthesize_204:
  - https://otheve.beacon.qq.com/analytics/v2_upload*
- id: tencent-profile-report
  scope:
    host: yybadaccess.3g.qq.com
    path: /v3/pcyyb_report_profile_info
    method: POST
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  synthesize_204:
  - https://yybadaccess.3g.qq.com/v3/pcyyb_report_profile_info*

# Tencent Video (v.qq.com) endpoints below. Evidence: the anonymous recordings
# 128_d124081f, 263_023152fe and 28_b62b8e8c and their offline branch replays in
# lookahead_15task_pixels_20261022. In each replay the page made a new random visitor id.
# Each rule names the fields it ignores; every other field stays in the key.

# Feature switches (POST config.ab.qq.com/tab/GetTabRemoteConfig, JSON body). guid is
# the page's random visitor id; responses do not echo it. config_keys selects the switches,
# so it stays. Without this rule the request missed, page_slice_search_hover_sdk_option was
# missing, the header asked for searchbox-sdk.js version 1.0.0 instead of the recorded
# 1.0.1, and the search box never loaded. In run 128, requests with two different guids
# and the same config_keys got the same response.
# The protobuf variant of this request is still matched on its whole body. Its field 5 is
# the cached config version, and that version decides between the full config and an
# 8-byte not-modified answer, so ignoring the body would serve the wrong one.
- id: tencent-video-feature-switches
  scope:
    host: config.ab.qq.com
    path: /tab/GetTabRemoteConfig
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_body_paths:
  - guid
# Experiment groups (POST data.ab.qq.com/wabt/get_gray_policy, JSON body {guid, appid}).
# guid is the same random visitor id as above; responses do not echo it. The groups are
# assigned per visitor, so replay serves the recorded visitor's groups in recorded order.
# appid stays.
- id: tencent-video-experiment-groups
  scope:
    host: data.ab.qq.com
    path: /wabt/get_gray_policy
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_body_paths:
  - guid
# Visitor bucket JSONP (GET access.video.qq.com/common_config/get_bi). callback is jQuery's
# random function name and _ is jQuery's timestamp cache buster. The JSONP rewrite then
# calls the name this request asked for. vappid and vsecret stay. All replays missed it.
- id: tencent-video-bucket-jsonp
  scope:
    host: access.video.qq.com
    path: /common_config/get_bi
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - callback
  - _
# Video search results (POST pbaccess.video.qq.com/.../MultiTerminalSearch/MbSearch, JSON).
# uuid is a random id the search box makes and keeps. Responses do not echo it. query,
# paging, filters and the feature list select the results and stay. In run 263, two
# recorded searches that differed only in uuid returned the same titles; only the tail
# order and badge JSON changed.
- id: tencent-video-search
  scope:
    host: pbaccess.video.qq.com
    path: /trpc.videosearch.mobile_search.MultiTerminalSearch/MbSearch
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_body_paths:
  - uuid
# Search suggestions (POST actapi.video.qq.com/.../SugRecallHttp/GetSugHttp, JSON body).
# sug_id is the client time in milliseconds followed by random hex, new for each request.
# query, scene_id and paging select the suggestions and stay.
- id: tencent-video-search-suggestions
  scope:
    host: actapi.video.qq.com
    path: /trpc.videosearch.smartboxServer.SugRecallHttp/GetSugHttp
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_body_paths:
  - sug_id
# Play page layout (POST pbaccess.video.qq.com/trpc.vector_layout.page_view.PageService/getPage):
# the title panel, episode list and recommendations beside the player. The query's
# vdevice_guid and the body's page_bypass_params.abtest_bypass_id hold the same random
# visitor id as above. In a replay of run 263 without this rule the request missed and the
# panel beside the player stayed empty. Answers echo the visitor id inside a session token
# (rec_session_id). Later pages send that token back in page_context, and replay serves
# recorded answers, so the token is the recorded one. page_bypass_params.params,
# page_context and the other query fields select the page and stay.
- id: tencent-video-page-layout
  scope:
    host: pbaccess.video.qq.com
    path: /trpc.vector_layout.page_view.PageService/getPage
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - vdevice_guid
  ignore_body_paths:
  - page_bypass_params.abtest_bypass_id
# Membership checks on the play page (GET vip.video.qq.com/fcgi-bin/comm_cgi). _ is the
# client time in milliseconds, added as a cache buster. name and cmd select the check;
# cid, vid and the callback stay.
- id: tencent-video-membership-check
  scope:
    host: vip.video.qq.com
    path: /fcgi-bin/comm_cgi
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - _
# Play page video info (POST vd6.l.qq.com/vinfo_proxy, JSON body). vqqcookie is a copy of
# document.cookie: visitor ids, counters and experiment strings that the replayed page
# rebuilds. The recordings were not logged in, so it carries no account. cid, vid,
# playParams and vinfoParams select the video and stay. In a replay of run 263 with every
# other rule here but not this one, this request missed, the cover page called
# FillUnionInfo, which the recording never called, and its script opened /error.html.
# Inside playParams, localHistoryPos and localHistoryVid (how far earlier visits played this
# video, from the page's own watch history) select content: the answer echoes the position as
# data.history.time and as playInfo.startTime with startTimeType "history" (recording
# 28_bf81312c of lookahead_15task_20261024, steps 20 and 23: 333 and 392). Offline the
# earlier visits do not play, so a replayed revisit sends an empty playParams and misses
# (28_bf81312c at step 20). A scratch replay that ignored playParams served it and changed
# nothing there: the player still asked proxyhttp for the video again (vinfoad and
# onlyvinfo, encryptVer 9.2), which the recording did not do at that step, and those missed.
- id: tencent-video-play-info
  scope:
    host: vd6.l.qq.com
    path: /vinfo_proxy
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_body_paths:
  - vqqcookie
# Fan community recommendations on the play page (POST pbaccess.video.qq.com/
# trpc.universal_backend_service.page_server_rpc.PageServer/GetPageData). Evidence: the
# offline branch replays of 28_1288c015, 128_f87bf58f and 263_5c1e8fab in
# lookahead_15task_20261023, made under the shared clock. The query's guid and video_omgid
# hold the page's random visitor id (the same value as guid above); in 71 near misses, 42 of
# them while restoring the recorded prefix, they were the only differing fields. Answers copy
# the id into item_report strings and into next_page_context, which the next page request
# sends back in its body, so later pages carry the recorded id, as in the recording. The
# body's page_params (page_id, page_type, data_key) and page_context select the page and
# stay, as do video_appid and the version fields.
- id: tencent-video-page-data
  scope:
    host: pbaccess.video.qq.com
    path: /trpc.universal_backend_service.page_server_rpc.PageServer/GetPageData
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - guid
  - video_omgid
# Player video info and ads (POST vd6.l.qq.com/proxyhttp, a JSON body whose vinfoparam and
# adparam values are URL-encoded query strings). Evidence: the offline branch replays
# 263_0f164596-s13-b0 and 28_c98c13b4-s25-b0 of lookahead_15task_freeze_20261023, whose live
# requests were dumped and compared with the recorded ones, and all 15 recordings of that root.
# buid says what is asked: onlyvinfo (the home page's focus-map preview), vinfoad (video info and
# pre-roll ads: search page previews and, in 28, the play page) or onlyad (ads only).
# vinfoparam selects the video info and is parsed; it ignores only:
# - cKey: the player's encrypted key over the video, the time and its ids, new for every request;
# - tm: the client time in seconds;
# - guid, flowid: random ids of the player and of this play.
# The video (vid), definition (defn), encryptVer, refer, ehost, player version and every other
# vinfoparam field stay. adparam is parsed too: adType and vid stay; flowid (this play) and
# sspKey are ignored. sspKey is four random letters, and the answer puts its ad part under that
# name (xhnr, woyv ...; true for all 32 recorded requests carrying adparam), so a replayed page,
# which asks under a new name, never finds a recorded ad answer whatever it asked. For the same
# reason the rule ignores sspAdParam, the ad request's context (a JSON document with the visitor
# id, the flow id, the client time, a new request UUID, the page URL and referrer and a game
# session token): what it selects is the ad part, which the replayed page cannot read. The page
# reads errCode, vinfo and lcAdCookie, all selected by buid, vinfoparam and adparam. Without this
# rule every replayed request missed, the home and search page previews did not play, and in 28
# the play page asked for its video info again through onlyvinfo and then getvinfo, which the
# recording never needed. The play pages of 128 and 263 got their video info from vinfo_proxy
# (above), whose answer is encrypted; their replays then asked proxyhttp for that video with
# encryptVer 9.2, which the recordings never did, so no rule can serve it.
- id: tencent-video-player-info
  scope:
    host: vd6.l.qq.com
    path: /proxyhttp
    method: POST
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  parse_body_paths:
  - field: vinfoparam
    format: urlencoded
  - field: adparam
    format: urlencoded
  ignore_body_paths:
  - vinfoparam.cKey
  - vinfoparam.tm
  - vinfoparam.guid
  - vinfoparam.flowid
  - adparam.flowid
  - adparam.sspKey
  - sspAdParam
