# Video page overlays, found by mining the near misses of replays that already used the
# rules above (the forks of 118_180a3f31 and 158_f5a61bf9 in lookahead_15task_freeze_20261023,
# whose restored prefixes now reached the video pages): danmaku segments
# (GET /x/v2/dm/wbi/web/seg.so, 36 near misses), danmaku settings (GET /x/v2/dm/web/view,
# 10), subtitles (GET /x/v2/subtitle/web/view, 10) and the summary button
# (GET /x/web-interface/view/conclusion/judge, 10). Each differed only in wts and w_rid.
# Ignores wts, w_rid; oid, pid, cid, bvid, up_mid, type, segment_index, duration and the
# locale/device JSON stay.
- id: bilibili-danmaku-segments
  scope:
    host: api.bilibili.com
    path: /x/v2/dm/wbi/web/seg.so
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - wts
  - w_rid
- id: bilibili-danmaku-settings
  scope:
