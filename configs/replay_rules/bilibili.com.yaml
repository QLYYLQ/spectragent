# The space page's profile (GET /x/space/wbi/acc/info). First validated on 2026-10-20 on one
# authenticated recording: without the rule the profile page showed an error and the replay
# ended behind a login dialog; with it restoration passed 24 and 25 of 30 checks instead of
# 2 and 3. Then only dm_img_inter and w_rid changed between page loads; under the shared clock
# wts changes too (4 near misses in 6_144a80ce's forks). Ignores wts, w_rid, dm_img_inter;
# mid, token, platform, web_location and the other dm_* fields stay.
- id: bilibili-space-acc-info-signature
  scope:
    host: api.bilibili.com
    path: /x/space/wbi/acc/info
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - wts
  - w_rid
  - dm_img_inter
# The space page's follow state for the profile (GET /x/space/wbi/acc/relation). Ignores wts,
# w_rid; mid stays.
- id: bilibili-space-relation
  scope:
    host: api.bilibili.com
    path: /x/space/wbi/acc/relation
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
