# Page banners and promoted slots (GET /x/web-show/wbi/res/locs and its unsigned-path twin
# /x/web-show/res/locs, which carries the same signature). Ignores wts, w_rid; pf and ids
# (which slots) stay.
- id: bilibili-page-slots
  scope:
    host: api.bilibili.com
    path: /x/web-show/wbi/res/locs
    method: GET
    port: 443
  priority: 0
