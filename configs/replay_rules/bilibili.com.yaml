# Bilibili (www.bilibili.com, search.bilibili.com, space.bilibili.com) content APIs on
# api.bilibili.com. Pinned recording gives every tab one shared clock (T0 at run start, then
# real time), so a replayed page signs its requests at a different second than the recording.
#
# Fields these rules ignore:
# - wts: the client clock in seconds, added to every WBI-signed request.
# - w_rid: the WBI signature, md5 over all other query fields (sorted, with !'()* removed),
#   wts and a signing key. Across the recordings 6_144a80ce, 118_1426a023 and 158_ed5011ea,
#   106 of 127 signed requests on 22 endpoints recompute from their other query fields and the
#   keys in the ticket answer (GenWebTicket nav.img / nav.sub). The other 21 were sent before
#   the page had that answer, so it signed them with a key of its own; their other fields
#   still select the content.
# - dm_img_inter: window size and scroll offset mixed with fresh random numbers (anti-bot
#   telemetry); the other dm_* fields stay in the key.
# - qv_id: a random 32-character id the search page makes for each search; no recorded answer
#   contains it.
# - session: a random md5 the player makes for each play request. Two recorded requests in
#   118_1426a023 for the same video and cid carried different values.
# No recorded answer contains a w_rid, qv_id or session; a wts value appears only inside
# server request ids, ad links and server times.
#
# Evidence: the offline branch replays of those three recordings in
# lookahead_15task_20261023, made under the shared clock. Every content request below missed,
# and its nearest recorded request differed only in these fields; for the play URL and player
# info also in cid, which the page takes from the video detail answer that had missed too
# (the request then went out without it). Search results came back
# empty (the page showed its no-results message), so 2 of 52 Bilibili forks restored their
# checkpoint. Content selectors stay in every key: keyword, page, page_size, order, search
# type and filters, mid, bvid, avid, cid, ids, term and the locale/device JSON fields. A
# different search, video or profile still misses.
rules:
# Search results for one result type (GET /x/web-interface/wbi/search/type), the request
# behind the result grid. Ignores wts, w_rid, qv_id.
- id: bilibili-search-results
  scope:
    host: api.bilibili.com
    path: /x/web-interface/wbi/search/type
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - wts
  - w_rid
  - qv_id
# The combined search page's results (GET /x/web-interface/wbi/search/all/v2). Ignores wts,
# w_rid, qv_id.
- id: bilibili-search-all
  scope:
    host: api.bilibili.com
    path: /x/web-interface/wbi/search/all/v2
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - wts
  - w_rid
  - qv_id
# The search box's placeholder keyword (GET /x/web-interface/wbi/search/default). Ignores wts,
# w_rid; web_location (which page asks) stays.
- id: bilibili-search-placeholder
  scope:
    host: api.bilibili.com
    path: /x/web-interface/wbi/search/default
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
