  ignore_query:
  - wts
  - w_rid
# The trending list under the search box (GET /x/web-interface/wbi/search/square). Ignores
# wts, w_rid; limit and platform stay.
- id: bilibili-search-trending
  scope:
    host: api.bilibili.com
    path: /x/web-interface/wbi/search/square
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
