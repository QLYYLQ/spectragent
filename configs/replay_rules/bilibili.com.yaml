  - normalized
  ignore_query:
  - wts
  - w_rid
# Search suggestions while typing (GET /x/web-interface/suggest). Ignores wts, w_rid; term
# (the typed text) stays.
- id: bilibili-search-suggestions
  scope:
    host: api.bilibili.com
    path: /x/web-interface/suggest
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
