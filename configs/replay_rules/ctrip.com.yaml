# Ctrip (www.ctrip.com, m.ctrip.com, trains.ctrip.com, flights.ctrip.com).
# x-traceID: <client id>-<time>-<random> on every m.ctrip.com/restapi call
#   (...-1791958761572-20176... vs ...-1791958761672-96387...); the service path and the
#   body select the content. _rm: a random float on tripAds.json.
ignore_query: [x-traceID, _rm]
# Visitor and client ids inside restapi bodies:
#   head.cid (getAppConfig.json: 1791958761572.a3abgLM99uKC vs 1791958761572.afe7NRTwhgLM),
#   head.Frontend.vid (getHotDestination: ...3d88TwhgLM99 vs ...afe7NRTwhgLM),
#   head.clientID (getHotDestination: 09031074310868542872 vs "" on the first call),
#   user.vid (tripAds.json, the same visitor id).
# id: tripAds.json's request id, SHOP__1.0.6_<random UUID> (3f5ee0b6-30d7-... vs
#   30d724c6-2796-...). Without the ad body rules (id, user.vid and the head ids), the home
#   page's ad requests miss again: same-path fidelity 0.92 -> 0.75 in a run with a scripted
#   model.
# RISK, kept on purpose (the user's ruling of 2026-10-14): a site rule applies to its whole
#   domain, so "id" is ignored in the top-level "id" field of EVERY ctrip.com request body,
#   not only tripAds.json's. Only tripAds.json carried a top-level id in the recordings this
#   rule was written from; an endpoint that selects content by a top-level id (a hotel, a
#   train, an order) would match any recorded call of that endpoint, and a branch that reaches
#   it could be served another item's data. If a replay shows the wrong item, look here first.
ignore_body_paths: [head.cid, head.clientID, head.Frontend.vid, user.vid, id]
# recordErrorLog: the page's error log, called only because other calls failed.
synthesize_204:
  - "https://m.ctrip.com/restapi/soa2/23619/json/recordErrorLog*"
