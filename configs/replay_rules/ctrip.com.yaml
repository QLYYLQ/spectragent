# x-traceID is a client id, time and random suffix; only recorded m.ctrip.com restapi
# endpoints and methods listed here ignore it. The path and body still select content.
# App config head.cid, destination head.clientID/head.Frontend.vid and ad user.vid are visitor ids.
# Only tripAds.json ignores its top-level id: SHOP__1.0.6_<random UUID>. Other request bodies
# retain id; the earlier domain-wide content-selection risk is removed. _rm is the ad request random float.
rules:
- id: ctrip-app-config
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/18088/getAppConfig.json
    method: POST
  priority: 0
  exhaustion: repeat_last
  ignore_body_paths:
  - head.cid
- id: ctrip-hot-destinations
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/21881/json/getHotDestination
    method: POST
  priority: 0
  exhaustion: repeat_last
  ignore_body_paths:
  - head.clientID
  - head.Frontend.vid
- id: ctrip-ad-request
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/13916/tripAds.json
    method: POST
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - _rm
  ignore_body_paths:
  - head.cid
  - head.clientID
  - head.Frontend.vid
  - user.vid
  - id
- id: ctrip-error-log
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/23619/json/recordErrorLog
    method: POST
  priority: 0
  exhaustion: repeat_last
  synthesize_204:
  - https://m.ctrip.com/restapi/soa2/23619/json/recordErrorLog*
- id: ctrip-format-number
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/12216/json/queryFormatNum
    method: POST
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - x-traceID
- id: ctrip-general-config
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/12378/json/getGeneralConfigData
    method: GET
  priority: 0
  exhaustion: repeat_last
  ignore_query:
  - x-traceID
- id: ctrip-qr-code
  scope:
    host: m.ctrip.com
    path: /restapi/soa2/13242/json/getWxqrCode
    method: POST
  priority: 0
  exhaustion: repeat_last
