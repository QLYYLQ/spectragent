# The recorded analytics endpoint uses actionTime as a timestamp and deviceid as a
# random UUID (8b42c835-... vs 42c83548-...). Other rmapi paths retain both fields.
rules:
- id: business-herald-analytics-record
  scope:
    host: rmapi.nfzmy.com
    path: /nfzmy-analytics-api/analytics/sendRecord
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - actionTime
  - deviceid
