# GetPic.aspx timespan is a random cache buster (367959); nid selects the chart.
# Web_JS/Web_Event parameters are timings and session ids (272 vs 1801, random suffixes).
# version.jsonp always calls the fixed function callback; its callback query is unused
# (all six recorded response bodies were identical). Other callback parameters remain.
rules:
- id: eastmoney-chart-image
  scope:
    host: webquotepic.eastmoney.com
    path: /GetPic.aspx
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - timespan
  keep_query:
  - nid
- id: eastmoney-page-log
  scope:
    host: bdwblog.eastmoney.com
    path: /bd-blink-server/asyncgapi/Web_JS.gif
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - domreadyt
  - wt
  - mt
  - asi
  - psi
- id: eastmoney-event-log
  scope:
    host: bdwblog.eastmoney.com
    path: /bd-blink-server/asyncgapi/Web_Event.gif
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - mt
- id: eastmoney-sdk-version
  scope:
    host: anonflow2.eastmoney.com
    path: /ewtsdk/version.jsonp
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - callback
- id: eastmoney-recommendation-log
  scope:
    host: huaxiang.eastmoney.com
    path: /CommonRecommend.png
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  synthesize_204:
  - https://huaxiang.eastmoney.com/CommonRecommend.png*
