# Douban: /misc/ct cost is image loading time (50 vs 0). /piwik fields are visitor,
# page-view and timing values. erebor / names a random JSONP function; replay rewrites
# the opening callback to the requested name. unit and bid remain content selectors.
# The old global timestamp heuristic is removed: ts is retained here until separately evidenced.
rules:
- id: douban-image-timing
  scope:
    host: www.douban.com
    path: /misc/ct
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - cost
- id: douban-analytics-pixel
  scope:
    host: fundin.douban.com
    path: /piwik
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - _id
  - pv_id
  - pf_dm1
  - pf_net
  - pf_srv
  - pf_tfr
- id: douban-ad-callback
  scope:
    host: erebor.douban.com
    path: /
    method: GET
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  ignore_query:
  - callback
  keep_query:
  - unit
  - bid
  - ts
