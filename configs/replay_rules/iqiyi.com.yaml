# iQIYI (www.iqiyi.com). Evidence: the anonymous recordings 18_7e42e97c and 208_6925a91f
# and the offline branch replays of 18 in lookahead_15task_pixels_20261022.
# timestamp is the client clock in milliseconds. sign is upper-case md5 over every other
# query field, decoded and sorted, plus a fixed key from the page script. All eight
# recorded signatures were recomputed that way, so sign carries nothing else.
rules:
# Search result click (GET www.iqiyi.com/tvg/to_page_url). The answer is a 302 to the
# video page (v_<id>.html), chosen by tv_id or album_id. ext_params holds lt, e2 and
# qyTrace, a fresh random trace id per click; the Location header only copies them.
# Without this rule the replay missed the redirect and the tab showed a Chrome error page.
# tv_id, album_id, app_version and on_record stay; a different video still misses.
- id: iqiyi-video-page-redirect
  scope:
    host: www.iqiyi.com
    path: /tvg/to_page_url
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - ext_params
  - timestamp
  - sign
# Video page details (GET mesh.if.iqiyi.com/tvg/v2/lw/base_info): title, episodes and
# the player's first data. entity_id selects the video; user and version fields stay. Under
# the per-document clock only timestamp and sign changed between recorded and replayed page
# loads; under the shared clock the device id changes too (see "Visitor device id" below).
# The answer copies the device id only into URLs the page loads next (load_url,
# load_all_url, label and ad URLs), so those carry the recorded id, as in the recording.
- id: iqiyi-video-base-info
  scope:
    host: mesh.if.iqiyi.com
    path: /tvg/v2/lw/base_info
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - timestamp
  - sign
  - device_id

# Visitor device id. Evidence: the offline branch replays of 18_cec36336, 108_4724bcba and
# 208_c296fc2e in lookahead_15task_20261023, made under the shared clock (pinned recording
# gives every tab one clock, T0 then real time). The replayed page makes a new random device
# id for its visitor (32 hex digits; none of the 56 values seen in the forks equals the
# recorded one) and sends it as device, deviceId, device_id, deviceID, qyid, u, or the
# grading body's cid.
# Every request below missed, and its nearest recorded request differed only in that id (and,
# where named, timestamp: the client clock in milliseconds, or sign: the same signature as the
# rules above, recomputed on all 16 recorded app_help_info and layer_game requests). Answers do
# not echo the id, except inside ad responses, pingback strings and URLs the page loads next.
# In 7 forks of the re-recordings 108_aa3a5b75 and 208_a35d7d11
# (lookahead_15task_freeze_20261023), without these rules 6 stayed on the home or search page
# instead of the recorded one; with them all 7 reached it and 2 restored (none before).
# Content selectors stay: channel and page fields, key (the typed text), search paging and
# filters, tvId/entity ids, interfaceCode, versions and the other fields.
# Experiment buckets for the visitor (GET /portal/lw/abtest): ignores device.
- id: iqiyi-experiment-buckets
  scope:
    host: mesh.if.iqiyi.com
    path: /portal/lw/abtest
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - device
