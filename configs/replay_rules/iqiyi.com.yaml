# Play page requests signed per page load, and the channel pages' ad-network token. Evidence:
# the offline branch replays of 18_b2fc886d, 108_113ae4b3 and 208_426ea862 in
# lookahead_15task_20261024 (72 forks, 37 of them restored their checkpoint). Each request below
# missed in those replays, and its nearest recorded request was left unconsumed and differed
# only in the fields its rule ignores. After a failed mesh.if.iqiyi.com request the page's request
# library retries it through www.iqiyi.com/prelw (its requestRetryByCDN plugin rewrites the
# address), which the recordings never requested, so the retries miss too.
#
# timestamp is the client clock in milliseconds (seconds on img/loading). sign is md5 over the
# other fields, sorted by name and joined as name=value with '&', then '&<key name>=<key>' with a
# fixed key from the page script. Two keys are in use: upper-case md5 with key name secret_key
# (play_history, video_metadata, async_pr_control, play/tips, after_play_control,
# realtime_action, as on base_info above), and lower-case md5 with key name key (img/loading and
# the four player/w/video endpoints, as on the poster badges; there the page also signs its
# undefined uid as 'uid=' but does not send it). All 99 recorded signatures of these endpoints
# were recomputed that way, so sign carries nothing else. ask_after_play is not covered: its 2
# recorded signatures did not recompute.
#
# Ad-network token. adn_token (base_info above) and adnToken (channel pages below) come from the
# page's getAdToken, which builds them only from two ad caches in localStorage: the PC app
# store SDK's visitor marks (CUPID_PCW_PCYYB) and the ad network ids from the ad server's
# answer (CUPID_PLATFORM_ID, written from t7z.cupid.iqiyi.com/mixer), one entry per id under
# data.zx.platformIds. Every recorded value is {}: the recording's archived localStorage held
# CUPID_PLATFORM_ID with ids for another network (ylh) and an empty zx list, so the token names
# no network. Offline the ad server request misses (it carries a random callback name cb and the
# client time h), and the fork's archived localStorage has no CUPID_PLATFORM_ID
# (208_426ea862-s21-b0, step 19), so the page sends adn_token empty and leaves adnToken out.
# Both say the page has no ad-network token; the answers do not contain it.
# TV channel page (GET /portal/lw/v7/channel/tv): ignores adnToken; uid, device, page and the
# other fields stay. Recorded twice in 208_426ea862, both with adnToken={}; all 13 replayed
# requests (8 forks) missed on it. The /tv/ page then showed 网络异常 … 重试 instead of its
# cards, and the step-20 click on 隐秘的角落 did not open the play page: the step-21 and step-22
# forks restored /tv/ instead.
- id: iqiyi-tv-channel
  scope:
    host: mesh.if.iqiyi.com
    path: /portal/lw/v7/channel/tv
    method: GET
    port: 443
  priority: 0
  exhaustion: repeat_last
  unavailable: serve_identical
  levels:
  - exact
  - normalized
  ignore_query:
  - adnToken
