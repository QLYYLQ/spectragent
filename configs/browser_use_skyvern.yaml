# BrowserUseAgent + ReactLoop running against the hosted Skyvern backend.
#
# Differs from browser_use_local.yaml only in
# ``environment[0].capabilities[0].backend`` — every other section is
# identical. Set SKYVERN_API_KEY in your environment before running.
# See browser_use_local.yaml for what the layout rules mean.

agent:
  - agent_id: browser_use
    id: main
    flash_mode: false
    observation_mode: dom          # dom | dom_vision | vision
    use_thinking: true
    is_anthropic: false

    agent_loop:
      loop_id: react
      max_steps: 30
      max_actions_per_step: 1
      # Re-ask inside the step the observation already paid for; see the
      # note in browser_use_local.yaml. ``0`` restores the old behaviour.
      parse_retries_per_step: 2

    # ``model_type`` is the protocol, not the brand: gemini-* takes
    # ``google`` at the gateway root, claude-* takes ``anthropic`` at the
    # root, and ``openai`` (at ``<root>/v1``) is for models whose native API
    # is already the OpenAI one. See browser_use_local.yaml for the measured
    # reason, and docs/llm/dmxapi.cn.md for the numbers.
    llm:
      model_type: openai
      model: gpt-4o
      provider:
        name: direct

    memory:
      memory_id: simple
      max_messages: 200

environment:
  - env_type: browser
    id: browser_env
    capabilities:
      - capability_id: browser
        profile: standard
        viewport_width: 1280
        viewport_height: 720

        # See browser_use_local.yaml for what these three blocks buy you.
        mouse_trajectory:
          trajectory_type: instant

        typing_rhythm:
          rhythm_type: instant

        dom_cleaner:
          cleaner_type: browser_use

        dom_serializer:
          serializer_type: text

        # Switch backend = edit only this block.
        backend:
          provider_id: skyvern
          # Either set SKYVERN_API_KEY env var (provider reads it) or paste here:
          # api_key: sk-...
          timeout_minutes: 30
          solve_captcha: false
          adblock: false

# Cross-cutting hooks — see configs/browser_use_local.yaml for why
# ``trace_writer`` has to be declared here for a direct run to leave a
# trace on disk.
hook:
  - hook_id: trace_writer
    trace_dir: traces
  - hook_id: metrics
