# OpenRouter Decisions route; set OPENROUTER_API_KEY in the invoking environment.
replay_reviewer:
  - reviewer_id: jev
    decision_model:
      model_type: typesafe
      model: typesafe/jev-1.14
      provider: {name: openrouter}
      base_url: https://openrouter.ai/api
      api_key_env: OPENROUTER_API_KEY
      timeout: 35
    include_screenshots: true
    max_text_chars: 12000
    max_links: 64
    policy:
      version: replay-triage-1
      confidence_min: 0.9
      equivalence_min: 0.8
      difference_max: 0.2
