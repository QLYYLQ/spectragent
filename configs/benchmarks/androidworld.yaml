# AndroidWorld's tasks on an emulated phone. Select it with --benchmark androidworld:
#
#   spectragent bench --config <your Android run configuration> --benchmark androidworld
#
# The task lists, and AndroidWorld's open_app name table beside them, are written
# offline by task_list.py beside AndroidWorld's launcher
# (spectragent/benchmarks/androidworld/androidworld_service/,
# docs/architecture_design.md §11.2). The setup component prepares each task on
# the device through AndroidWorld's own service, run from the installation under
# the benchmark data root ($SPECTRAGENT_BENCHMARK_DATA/android/androidworld/installation,
# whatever the task loader's data_dir says) unless root says otherwise.
#
# Its verifier, androidworld, is AndroidWorld's own success check: it needs the
# live device, so it judges each task at the scoring point, after the agent's
# run and before the device goes, within --verify-timeout, through the service
# the setup component started. Its verdict goes into the run's verdicts/ and is
# this benchmark's primary verdict. Leave it out and the runs are not judged.
#
# The benchmark's part of the Android capability's configuration is merged into
# the run configuration's Android block (§4.10.1): the AVD AndroidWorld's one-time
# setup prepared, below, and the open_app name table, read from beside the task
# lists. The run configuration writes neither; a field both write differently is
# refused.
benchmark:
  - benchmark_id: androidworld
    task_loader:
      benchmark_name: androidworld
      subset: All
      data_dir: null             # null: $SPECTRAGENT_BENCHMARK_DATA/android/androidworld
    setup:
      setup_id: androidworld
      root: null                 # null: $SPECTRAGENT_BENCHMARK_DATA/android/androidworld/installation
    verifiers:
      - verifier_id: androidworld
    capability:
      - capability_id: android
        backend: {provider_id: local_emulator, avd: AndroidWorldAvd}
