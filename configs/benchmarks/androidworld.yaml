# AndroidWorld's tasks on an emulated phone. Select it with --benchmark androidworld:
#
#   spectragent bench --config <your Android run configuration> --benchmark androidworld
#
# Install AndroidWorld, then make its task lists (docs/architecture_design.md §4.10.1, §11.2):
#
#   spectragent benchmark setup androidworld    # its checkout, venv and forwarder
#   spectragent benchmark fetch androidworld    # its task lists and open_app table
#
# setup installs into the shared cache (<data root>/android/androidworld/installation,
# whatever the task loader's data_dir says) unless root says otherwise, and names what
# only you can install: ffmpeg, and the AVD below, prepared by AndroidWorld's one-time
# setup. fetch runs task_list.py in that installation, from the pinned commit. The setup
# component prepares each task on the device through AndroidWorld's own service.
#
# Its verifier, androidworld, is AndroidWorld's own success check: it needs the
# live device, so it judges each task at the scoring point, after the agent's
# run and before the device goes, within --verify-timeout, through the service
# the setup component started. Its verdict goes into the run's verdicts/ and is
# this benchmark's primary verdict. Leave it out and the runs are not judged.
#
# The benchmark's part of the Android capability's configuration is merged into
# the run configuration's Android block (§4.10.1): the AVD AndroidWorld's one-time
# setup prepared and its runner's typing and scroll, below; the open_app name table,
# read from beside the task lists; and the longest wait for a still screen, 6 s
# (2 s for a subset of MiniWoB++ tasks), computed in code from the subset run. The
# run configuration writes none of them; a field both write differently is refused.
#
# The typing and scroll are how AndroidWorld's own runner drives every agent, at
# its pinned commit 55ddaf5e (android_world/ in its checkout):
#   typing: adb shell input text with the text decomposed and every non-ASCII
#     character dropped (env/adb_utils.py:472-494, 511-545), which is the
#     key_events backend with fold_accents;
#   android.scroll: from the centre of the element (else the screen) to its edge
#     (env/actuation.py:138-163), sent as adb shell input swipe with no duration
#     (env/adb_utils.py:754-783), which the device runs in 300 ms (Android's
#     InputShellCommand.sendSwipe).
# The still period stays the capability's own 300 ms: AndroidWorld's 1 s compares
# element lists, ours also counts drawn frames, and a focused field's cursor would
# keep 1 s from ever passing (docs/architecture_design.md §4.10.1).
#
# Each task boots its own emulator. With spectragent bench --reuse-environment the
# tasks of a sweep share one: the setup resets the device between tasks, as
# AndroidWorld's own runner does, and keeps its service running
# (docs/architecture_design.md §4.10.1).
benchmark:
  - benchmark_id: androidworld
    task_loader:
      benchmark_name: androidworld
      subset: All
      data_dir: null             # null: the cache copy, <data root>/android/androidworld
    setup:
      setup_id: androidworld
      root: null                 # null: <data root>/android/androidworld/installation
    verifiers:
      - verifier_id: androidworld
    capability:
      - capability_id: android
        backend: {provider_id: local_emulator, avd: AndroidWorldAvd}
        typing_backend: {typing_id: key_events, fold_accents: true}
        actions:
          - {action_id: android.scroll, swipe_to: target_edge, duration_ms: 300}
