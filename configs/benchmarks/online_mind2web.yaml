# Online-Mind2Web: live web tasks. Select it with --benchmark online_mind2web:
#
#   spectragent bench --config configs/browser_use_local.yaml --benchmark online_mind2web
#   spectragent run --config configs/browser_use_local.yaml --benchmark online_mind2web --task-id <id>
#
# A benchmark YAML holds only this section; the run configuration holds the
# agent, its environment and its hooks (docs/architecture_design.md §4.10.1).
# Its data is osunlp/Online-Mind2Web on Hugging Face, pinned at a commit and gated:
# accept its terms there, then HF_TOKEN=<token> spectragent benchmark fetch online_mind2web.
# For another subset add --subset Hard, which is written into the task loader
# below; for a data directory of your own, copy this file and pass its path:
# --benchmark ./my_online_mind2web.yaml.
#
# Each task gets 25 steps, the budget Online-Mind2Web's authors gave every open-source
# agent (its paper, Appendix E: https://arxiv.org/abs/2504.01382v4). The task loader hands
# it to the Loop as max_steps; the run configuration's max_steps stays the ceiling, so a
# smaller one caps it (docs/architecture_design.md §4.10.1).
benchmark:
  - benchmark_id: online_mind2web
    task_loader:
      benchmark_name: online_mind2web
      subset: All                # All | Hard
      data_dir: null             # null: the cache copy, <data root>/browser/online_mind2web
    # eval_loader: the reference answers verdicts are scored against. Left out,
    # it is the registered online_mind2web eval loader for the task loader's
    # subset; write it to point at other data:
    #   eval_loader: { benchmark_name: online_mind2web, subset: All, data_dir: ~/data/online_mind2web }
    # verifiers: who judges the runs. None is listed: an LLM judge's model must be
    # one you verified first (docs/browser_agent_runbook.md, "独立评测已录下的任务").
    # In a copy of this file, list WebJudge with that model, then judge with
    # spectragent eval --benchmark <the copy>, or spectragent bench without --no-eval:
    #   verifiers:
    #     - verifier_id: online_mind2web     # WebJudge; reads no reference row
    #       require_screenshots: true        # a trace with no screenshot is an error, not a text-only verdict
    #       # temperature 0 is WebJudge's own: every call takes generate()'s temperature=0,
    #       # https://github.com/OSU-NLP-Group/Online-Mind2Web/blob/f0d805ee0e9e0b3ea70911e45e5264b72968f3dc/src/utils.py#L115-L122
    #       llm: { model_type: openai, model: <a verified vision model>, provider: { name: direct }, temperature: 0 }
