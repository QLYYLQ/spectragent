# BrowseComp: questions answered by browsing, with encrypted reference answers.
# Select it with --benchmark browsecomp (docs/architecture_design.md §4.10.1).
benchmark:
  - benchmark_id: browsecomp
    task_loader:
      benchmark_name: browsecomp
      subset: All
      data_dir: null             # null: $SPECTRAGENT_BENCHMARK_DATA/browser/browsecomp
    # eval_loader left out: the registered browsecomp eval loader for the task loader's subset.
