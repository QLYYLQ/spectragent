# LexBench-Browser's public tasks. Select it with --benchmark lexbench_browser
# (docs/architecture_design.md §4.10.1); for one subset, add --subset <subset>.
# Its data is the public Lexmount/LexBench-Browser v1.0 on Hugging Face, pinned at a
# commit: fetch it into the shared cache with spectragent benchmark fetch lexbench_browser
# (or run and bench with --fetch).
benchmark:
  - benchmark_id: lexbench_browser
    task_loader:
      benchmark_name: lexbench_browser
      subset: All                # All (210) | global (92) | lexmount (118) | sample50 (50 of All)
      data_dir: null             # null: the cache copy, <data root>/browser/lexbench_browser
    # eval_loader left out: the registered lexbench_browser eval loader for the task loader's subset.
    # verifiers: who judges the runs. None is listed: an LLM judge's model must be
    # one you verified first (docs/browser_agent_runbook.md, "独立评测已录下的任务").
    # In a copy of this file, list it with that model, then judge with
    # spectragent eval --benchmark <the copy>, or spectragent bench without --no-eval:
    #   verifiers:
    #     - verifier_id: lexbench_browser    # rubric-scored, with the task's pass mark
    #       eval_strategy: stepwise          # final: the last frame only
    #       llm: { model_type: openai, model: <a verified vision model>, provider: { name: direct } }
