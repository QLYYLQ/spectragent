# UI-TARS text-protocol, screenshot-only agent on local Chrome. Select a
# vision model that can emit the UI-TARS Action: syntax; see runbook.
agent:
  - agent_id: ui_tars
    id: main
    prompt_template: computer_use
    coordinate_space: screenshot_pixels
    agent_loop:
      loop_id: react
      max_steps: 30
      max_actions_per_step: 4
    llm:
      model_type: openai
      model: gpt-4o
      provider: { name: direct }
      # The openai provider sent these two by default until 2026-11-04 and now
      # sends none it is not given: written out, this run samples as before.
      temperature: 0.2
      frequency_penalty: 0.3
    memory: { memory_id: simple, max_messages: 200 }

environment:
  - env_type: browser
    id: browser_env
    capabilities:
      - capability_id: browser
        profile: standard
        mouse_trajectory: { trajectory_type: instant }
        typing_rhythm: { rhythm_type: instant }
        replayability: { replayability_id: none }
        network_source: { source_id: live }
        dom_cleaner: { cleaner_type: browser_use }
        dom_serializer: { serializer_type: text }
        backend:
          provider_id: local_chrome
          headless: false

hook:
  - hook_id: trace_writer
    trace_dir: traces
