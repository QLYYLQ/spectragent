# Same-path replay of recorded UI-TARS runs (data flywheel): the metrics
# chain's measure of replay fidelity (docs/architecture_design.md §4.16). A
# branch sweep in which every task restores a recorded run to its LAST
# branchable step: prefix_replay re-executes and verifies every earlier step
# (verify: warn — a step that does not verify is recorded and the run goes on,
# so every step gets a check), then the teacher decides that last step once
# (one model call per task) and the run ends with a terminal observation.
# Two tasks per source: the same input twice, for replay determinism.
#
#   spectragent bench --config configs/flywheel/same_path_ui_tars_archive.yaml \
#     --benchmark configs/flywheel/branches_last_step.yaml
#
# Pair it with the recording config (record_ui_tars_pinned.yaml): the agent,
# the tier and the browser block are the branch config's
# (branch_ui_tars_archive.yaml). The tasks come from the branches YAML
# (branches_last_step.yaml). The metrics chain (spectragent flywheel run)
# writes that YAML's data_dir (its traces/record) and trace_writer.trace_dir
# (its traces/same_path) itself; run it by hand by pointing data_dir at your
# recordings. A branch sweep lists no verifier, so it judges nothing and needs
# no --no-eval.
agent:
  - agent_id: ui_tars
    id: main
    prompt_template: computer_use
    coordinate_space: screenshot_pixels
    agent_loop:
      loop_id: branch
      max_steps: 30
      max_actions_per_step: 4
      continue_steps: 0                  # the recorded run's last step, decided once
      restorer:
        restorer_id: prefix_replay
        verify: warn                     # record a failed check and go on: every step is checked
    llm:                                 # the teacher: the recording's model
      model_type: openai
      model: gpt-4o
      provider: { name: direct }
    memory: { memory_id: simple, max_messages: 200 }

environment:
  - env_type: browser
    id: browser_env
    capabilities:
      - capability_id: browser
        profile: standard
        mouse_trajectory: { trajectory_type: instant }
        typing_rhythm: { rhythm_type: instant }
        replayability: { replayability_id: pinned, random_seed: 7, base_time: from_archive }
        network_source:
          source_id: archive
          shift_dates: none
          matcher: { site_rules: configs/replay_rules }
          miss_policy: { miss_policy_id: strict }
        dom_cleaner: { cleaner_type: browser_use }
        dom_serializer: { serializer_type: text }
        retarget_tolerance_px: 2.0
        screenshot_max_distance: 5       # Hamming distance of the 64-bit dHashes a restored screenshot may lie from the recorded one
        align_media: true                # move matched video/audio to the recorded position before each restored screenshot
        media_time_tolerance_s: 1.0      # a media position further from the recorded one fails media_mismatch
        media_seek_timeout_s: 2.0        # an alignment seek (and play) that does not complete in time is undone and fails
        media_end_lead_s: 0.5            # a video recorded at its end: seek this far before it and play into the end
        background_tabs: freeze           # a tab the agent left runs nothing until it returns; sites that open many tabs replay only with this. Same value when replaying or branching
        backend:
          provider_id: local_chrome
          headless: true

hook:
  - hook_id: trace_writer
    trace_dir: traces/same_path
    archive:
      - archiver_id: browser.replay_log  # the replay log of every task
      - archiver_id: browser.storage
      - archiver_id: browser.dom_raw
