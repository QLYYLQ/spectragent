# Branch recorded UI-TARS runs offline (data flywheel): every task puts a
# recorded run back where it stood before step t — the browser replays the
# source run's archive, the recorded prefix is re-executed and verified step by
# step — then lets the teacher (this config's llm) decide step t again.
# Pair it with the recording config (record_ui_tars_pinned.yaml): the agent and
# its knobs must be the source run's (checked before anything starts, naming
# both sides), and the browser block matches the replay config
# (replay_ui_tars_archive.yaml). Run a sweep:
#
#   spectragent-bench --config configs/flywheel/branch_ui_tars_archive.yaml --no-eval
#
# The tasks come from task_loader: trace_branches — one per selected step of
# every recorded run under data_dir, id <source_run_id>/s<t>/b<i>. Each task's
# context carries the source's setup (start_url), replay_archive (the source
# run directory) and the checkpoint; no CLI flag is needed. There is no eval
# loader for branch tasks yet, so pass --no-eval (a configured evaluator is
# refused before anything runs). docs/architecture_design.md §4.1 BranchLoop,
# §4.10 trace_branches, §4.14 "恢复：重定位与校验"; configs/README.md.
#
# What changes against the recording:
# - agent_loop: branch — the recorded prefix is rebuilt from the source trace
#   (the teacher sees the source's exact context), the environment is restored
#   by prefix_replay (strict: the first step that does not verify ends the run
#   as RestorationDivergedError), then one policy step and continue_steps more,
#   then a terminal observation.
# - network_source: archive + base_time: from_archive — as in the replay config,
#   and so is the archive list: browser.replay_log in browser.network's place.
# - The teacher samples hotter than the recording (temperature 0.8; the openai
#   default the recording ran with is 0.2) and every selected step gets three
#   branches: the branches of one step share every input, so sampling is what
#   makes them differ. agent_loop.branch_instruction (commented out below) can
#   add one fixed instruction at step t.
# - The trace writer records the branch runs somewhere else than the sources:
#   a branch run is never a source (branching a branch is refused).
agent:
  - agent_id: ui_tars
    id: main
    prompt_template: computer_use
    coordinate_space: screenshot_pixels
    agent_loop:
      loop_id: branch
      max_steps: 30
      max_actions_per_step: 1
      continue_steps: 0                  # 0: a single-step branch; N: N more ReAct steps
      # branch_instruction: prefer_different_action
      #   none (the default): the teacher gets no extra text. prefer_different_action:
      #   at step t only, one message quotes the reply the source gave at that step
      #   and asks for a different action that also moves the task forward.
      restorer:
        restorer_id: prefix_replay
        verify: strict                   # warn: record failed checks and go on
        screenshot_max_distance: 5       # Hamming distance of the 64-bit dHashes
    llm:                                 # the teacher: model and sampling may differ from the source
      model_type: openai
      model: gpt-4o
      provider: { name: direct }
      temperature: 0.8                   # the recording ran at the openai default, 0.2
    memory: { memory_id: simple, max_messages: 200 }

environment:
  - env_type: browser
    id: browser_env
    capabilities:
      - capability_id: browser
        profile: standard
        mouse_trajectory: { trajectory_type: instant }
        typing_rhythm: { rhythm_type: instant }
        replayability: { replayability_id: pinned, random_seed: 7, base_time: from_archive }
        network_source:
          source_id: archive
          shift_dates: none
          matcher: { site_rules: configs/replay_rules }
          miss_policy: { miss_policy_id: strict }
        dom_cleaner: { cleaner_type: browser_use }
        dom_serializer: { serializer_type: text }
        retarget_tolerance_px: 2.0       # how far a recorded element may move and still be re-found
        backend:
          provider_id: local_chrome
          headless: true

hook:
  - hook_id: trace_writer
    trace_dir: traces/branches
    archive:
      - archiver_id: browser.replay_log  # the replay log of every branch
      - archiver_id: browser.storage
      - archiver_id: browser.dom_raw
  - hook_id: metrics

task_loader:
  - benchmark_name: trace_branches
    data_dir: traces/recorded            # placeholder: the directory your recorded runs are in
    step_selector: { selector_id: all }  # every_k {k, offset} | explicit {steps: [...]} | last
    branches_per_step: 3                 # b0, b1, b2 per selected step, each sampled on its own
    agent_outcome: any                   # done | max_steps | error | timeout | vetoed: how the source's agent ended
                                         # (a checkpoint is always a step the source's trace is closed and complete through)
    on_unbranchable: raise               # skip: leave an unbranchable source out, with its reason
    # require_eval: { evaluator_id: online_mind2web, label: 1 }   # only runs a judge passed
