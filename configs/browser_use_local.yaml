# BrowserUse (``browser_use.dom``) + ReactLoop running against a local Chrome backend.
#
# Switching backend = editing only ``environment[0].capabilities[0].backend``.
# Schema lives in spectragent/generated/_composed.py — regenerate with
# `uv run python -m spectragent.scripts.generate_all` after registering
# new actions / capabilities / providers.
#
# Two rules explain the layout:
#
# 1. conscribe `inline_wiring=True` nests every wired child inside its
#    owning entry, so the agent block carries its loop / llm / memory
#    inline and the environment carries its capabilities inline.
# 2. ConfigComposer injects a wired child only when the owning class
#    declares a slot for it (an ``__init__`` parameter or a class-level
#    annotation). Wiring entries with no slot — the agent's
#    ``observation`` / ``action`` — are pure negotiation declarations read
#    straight off ``__wiring__``; they are optional in the schema and
#    omitted here. The agent declares them capability-relative
#    (``click``, not ``browser.click``), and negotiation binds each to the
#    capability the environment below actually holds.

agent:
  - agent_id: browser_use.dom    # browser_use.dom | browser_use.dom_vision
    id: main
    flash_mode: false
    use_thinking: true

    # Wired children (Composer instantiates and injects these).
    # ``max_steps`` / ``max_actions_per_step`` live on the loop, which is
    # the single source of truth: ReactLoop enforces them and advertises
    # them to the model through StepInfoObs.
    agent_loop:
      loop_id: react
      max_steps: 30
      max_actions_per_step: 4
      # Re-ask inside the step the observation already paid for, rather than
      # spending a whole step on a format mistake. Measured motivation: an
      # image challenge expires in about two minutes, and one unparseable
      # reply used to cost a fresh observe plus a step. ``0`` restores the
      # old behaviour; the cross-step ``max_consecutive_parse_errors`` still
      # terminates a model that cannot recover.
      parse_retries_per_step: 2

    # ``model_type`` is the *protocol*, not the vendor's brand — pick it by
    # which API the model's own vendor speaks, never by which gateway you
    # bought it through. Measured against dmxapi.cn (the table in
    # .agents/skills/af-add-an-llm-provider/references/guide.md §1):
    #
    #   gemini-*   -> model_type: google     base_url: <root>       (no /v1)
    #   claude-*   -> model_type: anthropic  base_url: <root>       (no /v1)
    #   gpt-*, and anything whose *native* API is already the OpenAI one
    #   (deepseek, qwen, glm)
    #              -> model_type: openai     base_url: <root>/v1
    #
    # A gateway's OpenAI-compatible route reaches a non-OpenAI model by
    # translating, and the translation is where structured output goes
    # missing: gemini-3.5-flash answers 400 on a closed action union, and
    # claude-haiku-4-5 came back 0/3 with a markdown-fenced reply whose keys
    # were not even the schema's — the schema had been dropped entirely. The
    # same two models pass on their native routes. This is why there is no
    # ``dont_force_structured_output`` knob any more: routing is the fix.
    llm:
      model_type: openai
      model: gpt-4o
      provider:
        name: direct
      # base_url: https://www.dmxapi.cn/v1   # gateway: OpenAI-family only

    memory:
      memory_id: simple
      max_messages: 200

# The Environment owns the capabilities. ``capabilities`` is a list, so a
# composite environment declares several here and each one keeps its own
# config; action names are routed by the ``capability_id`` prefix
# (``browser.click``).
#
# The list may also be omitted, in which case the env adopts every
# compatible capability the rest of the config built. Keep it explicit
# once a run holds more than one environment.
environment:
  - env_type: browser
    id: browser_env
    capabilities:
      - capability_id: browser
        profile: standard
        viewport_width: 1280
        viewport_height: 720

        # How the browser.screenshot *observation* is encoded. 'png' is
        # lossless and the default. 'jpeg' is the single biggest lever on a
        # vision run's step time — measured headless at 1280x720, a
        # Wikipedia article is 240KB of PNG against 107KB of JPEG q70 and
        # Chrome encodes it in half the time (68ms → 42ms), before the
        # upload the model waits on. A heavier page (zhihu.com) goes
        # 444KB → 116KB. The browser.screenshot *action* has its own
        # per-call format; this decides only what every observe ships.
        screenshot_format: png
        screenshot_quality: 80

        # How the cursor moves. A wired receptor, so the chosen strategy
        # arrives as a constructed instance carrying its own knobs —
        # ``windmouse`` takes ``gravity`` / ``wind`` / ``seed``,
        # ``bezier`` its control-point spread. The strategy is the only
        # humanization switch: ``instant`` is the legacy single jump (no
        # curved path, no eased wheel, no cursor approach before typing);
        # any other strategy humanizes every mouse action, adding roughly
        # 200-2000 ms each — for anti-bot-sensitive evals, not throughput.
        #
        # ``learned`` replays paths sampled from a model trained on recorded
        # human movements. ``weights_dir`` is a mouse-gan-torch export dir
        # (generator.npz + meta.json); which model it holds — the v1 GAN, the
        # v2 ``mdn`` or ``gan_ar`` — is read from its meta.json, never set
        # here, and so are its tick rate and training window (writing an ``hz``
        # or ``px_per_unit`` that disagrees is an error, not an override).
        # Needs the optional numpy extra: ``uv sync --extra learned-mouse``.
        # Every other knob has a default (seed, num_candidates, max_offset,
        # button_size, jitter, ...); see LearnedTrajectory.
        #
        # mouse_trajectory:
        #   trajectory_type: learned
        #   weights_dir: ~/QLY/code/study/mouse-gan-torch/runs/v2_mdn_h128_d3/export
        #   seed: 0
        mouse_trajectory:
          trajectory_type: instant

        # How text is typed. The keyboard's half of the same idea, on its
        # own axis, with the same rule: the strategy is the switch.
        # ``instant`` sends the whole string in one ``Input.insertText`` —
        # one CDP call, and (measured) *no* keydown/keypress/keyup at all,
        # so a page's keystroke listeners see a field fill in an instant.
        # ``human`` dispatches a real keydown/keyup per character on
        # lognormal flight times with word/punctuation structure and a
        # modelled key hold, at roughly 250 ms per character — for
        # anti-bot-sensitive evals, not throughput. Non-ASCII (all CJK) is
        # delivered per character by ``insertText`` on the same rhythm, so
        # a page gating on keydown sees nothing for it; see
        # ``input/keyboard.py``.
        #
        # typing_rhythm:
        #   rhythm_type: human
        #   median_iki_ms: 170
        #   seed: 0
        typing_rhythm:
          rhythm_type: instant

        # How far the run is pinned for replay (docs/architecture_design.md
        # §4.14) — the strategy is the switch, like the two above. ``none``
        # pins nothing and opens no second CDP connection. ``pinned`` seeds
        # Math.random / crypto, steps the JS clock from the run's start,
        # fixes time zone, locale, user agent and DPR, and adds its own
        # Chrome switches through this local_chrome backend:
        #
        # replayability:
        #   replayability_id: pinned
        #   random_seed: 1
        #   timezone: UTC
        #   locale: en-US
        #   device_scale_factor: 1.0
        replayability:
          replayability_id: none

        # Where the network comes from (§4.14 "回放") — the strategy is the
        # switch again. ``live`` is the network itself. ``archive`` answers
        # every request from a recorded run's archive (the run directory
        # arrives per task: ``spectragent run --replay-archive DIR``) and never
        # goes to the network; it isolates the browser through this
        # local_chrome backend and needs ``browser.replay_log`` on the trace
        # hook (it records the replay log; ``browser.network`` is refused in a
        # replay). configs/flywheel/ has the full setup.
        #
        # network_source:
        #   source_id: archive
        #   matcher: { levels: [exact, normalized], site_rules: configs/replay_rules }
        #   miss_policy: { miss_policy_id: strict }
        network_source:
          source_id: live

        # How the raw CDP capture becomes the tree the agent reads. Also a
        # wired receptor, so the strategy's knobs are reachable: this is
        # where you widen or narrow what gets an index.
        #
        # ``descendants_occlude`` is the one that diverges from upstream
        # browser-use, which counts a node's own descendants among the
        # boxes that can hide it (``true``). Here it defaults to ``false``,
        # because a click on a descendant *is* a click on the node, and
        # counting them drops exactly the controls that paint their face
        # with an inner element — reCAPTCHA's ``#recaptcha-anchor`` among
        # them. Set it ``true`` for upstream parity.
        dom_cleaner:
          cleaner_type: browser_use
          descendants_occlude: false

        # How that tree becomes the text in the prompt. A wired receptor
        # for the third time and for the third identical reason: it used
        # to be ``profile: {serializer: text}``, a name, so the watchdog
        # default-constructed the class and ``max_text_length`` was
        # configurable in name only.
        #
        # ``text`` is the indented browser-use format; ``html`` is the
        # compact skyvern one (its knob is ``max_href_length``).
        dom_serializer:
          serializer_type: text
          max_text_length: 200

        # What the browser.dom observation is allowed to cost. The DOM
        # half of screenshot_format / screenshot_quality above. Whenever a
        # limit cuts the tree, the fragment records it in ``DOMObs.budget``
        # so the trace can tell a truncated page from a sparse one. This
        # run caps the text before the agent sees it. Both caps default to
        # ``unlimited``.
        #
        # dom_max_elements: 150          # cap indexed elements (doc order)
        dom_max_serialized_chars: 40000  # cap the prompt text, cut at a line
        # dom_interactive_only: true     # drop the page's prose, keep controls
        # dom_viewport_only: true        # only what is on screen; scroll for more

        # Per-action behaviour lives on the action instance, so this list
        # is where you tune it. Every entry is validated against that
        # action's own config model, so a typo'd knob fails here rather
        # than at the first LLM call.
        #
        # It is also an *ablation* switch: only the actions named here are
        # instantiated, advertised to the model and executable. Omit the
        # block entirely — as this file does — to get all sixteen actions
        # the capability's __wiring__ offers. Narrow it and any agent that
        # requires a dropped action fails action negotiation, by design.
        # ``actions: []`` builds no action at all; it is not "the default".
        #
        # actions:
        #   - action_id: browser.navigate
        #     wait_until: networkidle
        #     post_delay_ms: 1500
        #   - action_id: browser.scroll
        #     default_amount: 600
        #   - action_id: browser.click
        #   - action_id: browser.type
        #   - action_id: browser.done

        # Execution-layer backend (IoC injection). Switch backend by
        # editing this block only — every other section stays identical.
        backend:
          provider_id: local_chrome
          headless: false
          window_width: 1280
          window_height: 720
          no_sandbox: false
          mute_audio: true
          startup_url: about:blank

# Cross-cutting hooks, woven onto agent/env/llm by core/aop. Without a
# ``trace_writer`` entry a run leaves nothing on disk, which makes "Record
# Once, Evaluate Many" unreachable from this file — evaluators read a
# RunTrace, not in-memory state. ``spectragent bench`` installs its own
# hooks and discovers the trace by duck-typing ``run_dir``, so declaring
# them here is what makes a *direct* run (demo_yaml_compose.py, or any
# AgentRuntime.execute caller) recordable too.
#
# ``trace_dir`` is the root every run's WAL directory is created under:
# traces land in ``<trace_dir>/<run_id>``. Relative paths resolve against
# the process working directory.
hook:
  - hook_id: trace_writer
    trace_dir: traces
