# BrowserUseAgent + ReactLoop running against a local Chrome backend.
#
# Switching backend = editing only ``environment[0].capabilities[0].backend``.
# Schema lives in spectragent/generated/_composed.py — regenerate with
# `uv run python -m spectragent.scripts.generate_all` after registering
# new actions / capabilities / providers.
#
# Two rules explain the layout:
#
# 1. conscribe `inline_wiring=True` nests every wired child inside its
#    owning entry, so the agent block carries its loop / llm / memory
#    inline and the environment carries its capabilities inline.
# 2. ConfigComposer injects a wired child only when the owning class
#    declares a slot for it (an ``__init__`` parameter or a class-level
#    annotation). Wiring entries with no slot — the agent's
#    ``observation`` / ``action`` — are pure negotiation declarations read
#    straight off ``__wiring__``; they are optional in the schema and
#    omitted here. The agent declares them capability-relative
#    (``click``, not ``browser.click``), and negotiation binds each to the
#    capability the environment below actually holds.

agent:
  - agent_id: browser_use
    id: main
    flash_mode: false
    use_vision: false
    use_thinking: true
    is_anthropic: false

    # Wired children (Composer instantiates and injects these).
    # ``max_steps`` / ``max_actions_per_step`` live on the loop, which is
    # the single source of truth: ReactLoop enforces them and advertises
    # them to the model through StepInfoObs.
    agent_loop:
      loop_id: react
      max_steps: 30
      max_actions_per_step: 3

    llm:
      model_type: openai
      model: gpt-4o
      provider:
        name: direct

    memory:
      memory_id: simple
      max_messages: 200

# The Environment owns the capabilities. ``capabilities`` is a list, so a
# composite environment declares several here and each one keeps its own
# config; action names are routed by the ``capability_id`` prefix
# (``browser.click``).
#
# The list may also be omitted, in which case the env adopts every
# compatible capability the rest of the config built. Keep it explicit
# once a run holds more than one environment.
environment:
  - env_type: browser
    id: browser_env
    capabilities:
      - capability_id: browser
        profile: standard
        viewport_width: 1280
        viewport_height: 720

        # How the cursor moves. A wired receptor, so the chosen strategy
        # arrives as a constructed instance carrying its own knobs —
        # ``windmouse`` takes ``gravity`` / ``wind`` / ``seed``,
        # ``bezier`` its control-point spread. The strategy is the only
        # humanization switch: ``instant`` is the legacy single jump (no
        # curved path, no eased wheel, no cursor approach before typing);
        # any other strategy humanizes every mouse action, adding roughly
        # 200-2000 ms each — for anti-bot-sensitive evals, not throughput.
        #
        # ``gan`` replays paths sampled from a GAN trained on recorded human
        # movements (mouse-gan-torch export dir: generator.npz + meta.json).
        # Needs the optional numpy extra: ``uv sync --extra mouse-gan``.
        # Every other knob has a default (seed, hz, num_candidates,
        # truncate_at_arrival, max_offset, button_size, jitter, ...); see
        # GanTrajectory.
        #
        # mouse_trajectory:
        #   trajectory_type: gan
        #   weights_dir: ~/QLY/code/study/mouse-gan-torch/runs/full/export
        #   seed: 0
        mouse_trajectory:
          trajectory_type: instant

        # Per-action behaviour lives on the action instance, so this list
        # is where you tune it. Every entry is validated against that
        # action's own config model, so a typo'd knob fails here rather
        # than at the first LLM call.
        #
        # It is also an *ablation* switch: only the actions named here are
        # instantiated, advertised to the model and executable. Omit the
        # block entirely — as this file does — to get all sixteen actions
        # the capability's __wiring__ offers. Narrow it and any agent that
        # requires a dropped action fails action negotiation, by design.
        #
        # actions:
        #   - action_id: browser.navigate
        #     wait_until: networkidle
        #     post_delay_ms: 1500
        #   - action_id: browser.scroll
        #     default_amount: 600
        #   - action_id: browser.click
        #   - action_id: browser.type
        #   - action_id: browser.done

        # Execution-layer backend (IoC injection). Switch backend by
        # editing this block only — every other section stays identical.
        backend:
          provider_id: local_chrome
          headless: false
          window_width: 1280
          window_height: 720
          no_sandbox: false
          mute_audio: true
          startup_url: about:blank

# Cross-cutting hooks, woven onto agent/env/llm by core/aop. Without a
# ``trace_writer`` entry a run leaves nothing on disk, which makes "Record
# Once, Evaluate Many" unreachable from this file — evaluators read a
# RunTrace, not in-memory state. ``spectragent-bench`` installs its own
# hooks and discovers the trace by duck-typing ``run_dir``, so declaring
# them here is what makes a *direct* run (demo_yaml_compose.py, or any
# AgentRuntime.execute caller) recordable too.
#
# ``trace_dir`` is the root every run's WAL directory is created under:
# traces land in ``<trace_dir>/<run_id>``. Relative paths resolve against
# the process working directory.
hook:
  - hook_id: trace_writer
    trace_dir: traces
  - hook_id: metrics
