[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectragent"
version = "0.3.0"
description = "Spectragent — a prism for agent evaluation across diverse benchmarks"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "QLYYLQ@github.com"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core infrastructure
    "conscribe>=1.1.1",
    "websockets>=13.0",
    "agent-cdp>=0.4.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.25",
    "jinja2>=3.1",

    # Cloud browser SDKs (lite — session lifecycle + CDP URL only)
    "lexmount>=0.4.2",
    "browser-use-lite",
    "hyperbrowser-lite",
    "agentbay-lite>=1.0.1",
    "airtop-lite",
    "skyvern-lite",

    # LLM provider SDKs
    "openai>=2.15",
    "anthropic>=0.76",
    "google-genai>=1.65",
    "groq>=1.0",
    "ollama>=0.4",
    "boto3>=1.35",
    "oci>=2.100",
    "Pillow"
]

[project.optional-dependencies]
comparison = [
    "cdp-use==1.4.5",
    "bubus==1.5.6",
    "uuid7==0.1.0",
    "markdownify>=0.11",
]
dev = [
    "ruff",
    "pyright",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]


[project.scripts]
spectragent-gen = "spectragent.scripts.generate_all:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["spectragent*"]

# ========== Pytest ==========

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ========== Ruff (from browseruse-bench) ==========

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["spectragent"]

# ========== Pyright (from browseruse-bench) ==========

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
