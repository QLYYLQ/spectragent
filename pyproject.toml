[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectragent"
version = "0.3.0"
description = "Spectragent — a prism for agent evaluation across diverse benchmarks"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "QLYYLQ@github.com"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core infrastructure
    "conscribe>=2.0.0,<3",
    "websockets>=15.0",
    "agent-cdp==0.5.0",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.25",
    "jinja2>=3.1",
    # WARC/1.1 writing for the browser network archive (Apache-2.0; its only
    # dependency is six). Never add py-wacz / cdxj-indexer / surt: AGPL chain.
    "warcio>=1.8.1",
    # Cloud browser SDKs (lite — session lifecycle + CDP URL only)
    "lexmount>=0.4.2",
    "browser-use-lite",
    "hyperbrowser-lite",
    "agentbay-lite>=1.0.1",
    "airtop-lite",
    "skyvern-lite",
    # LLM provider SDKs
    "openai>=2.15",
    "anthropic>=0.76",
    "google-genai>=1.65",
    "groq>=1.0",
    "ollama>=0.6.2",
    "boto3>=1.35",
    "oci>=2.100",
    "Pillow",
    "typer>=0.16",
    "rich>=14",
    "textual>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
comparison = [
    "cdp-use==1.4.5",
    "bubus==1.5.6",
    "uuid7==0.1.0",
    "markdownify>=0.11",
]
# The ``learned`` mouse-trajectory strategy samples an exported model with
# vendored numpy-only inference (``core/capabilities/browser/input/_mouse_gan_v*.py``).
# Nothing else in the package needs numpy, so it is not a core dependency.
learned-mouse = [
    "numpy>=1.26",
]
dev = [
    "ruff",
    "pyright",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Drives .pre-commit-config.yaml, whose hooks shell out to the ruff above
    # rather than pinning a second copy of it.
    "pre-commit>=3.5",
    # The learned strategy's tests exercise the numpy samplers.
    "spectragent[learned-mouse]",
]


[project.scripts]
spectragent = "spectragent.cli:main"
# Always build through this, never bare `uv build`: setuptools reuses
# `build/lib` without pruning, so two builds of one commit can differ.
spectragent-build = "spectragent.scripts.build_wheel:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["spectragent*"]

# The wheel's data content is exactly the globs below and nothing else.
# Left at its pyproject-era default of `true`, setuptools also pulls in
# whatever a previously generated `spectragent.egg-info/SOURCES.txt` lists,
# which resurrects files that have since been dropped from `package-data`.
[tool.setuptools]
include-package-data = false

# Runtime data files. `spectragent/prompts/**` is read at runtime by every agent's
# `_build_system_prompt` and by every evaluator (`path.read_text()` against
# `PROMPT_PATH`, a directory inside the installed package). The leaf prompt
# directories hold no `__init__.py`, so `packages.find` does not see them and this
# glob is the only reason they reach the wheel — without it an installed
# (non-editable) spectragent raises FileNotFoundError on first prepare().
#
# `benchmark_data/**` is deliberately NOT here. Globbing it made the wheel a
# function of the build machine's disk: a checkout without the data emits a
# smaller wheel under the same version, and a licensed 5 MB dataset is not
# something to ship by accident. Loaders find it via `data_dir:` or
# `$SPECTRAGENT_BENCHMARK_DATA` instead — see configs/README.md.
[tool.setuptools.package-data]
"spectragent" = ["prompts/**/*", "viewer/static/*", "viewer/static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

# ========== Pytest ==========

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::conscribe.ConscribeWarning"]

# ========== Ruff (from browseruse-bench) ==========

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["spectragent"]

# ========== Pyright (from browseruse-bench) ==========

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
